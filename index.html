            gap: 12px;
        }
        .card {
           background: linear-gradient(135deg,

            border-radius: 10px;
            animation: move 5s ease infinite;
        }
        @keyframes move {
             0% { transform: translateY(100px);}
             50%{ transform: translateY(0px);
               background-color: rgb(6, 6, 235);
               color:#ffffff;
               scale: 0.5;
               rotate: 55deg;
               overflow-anchor: none;
               opacity: 2;
            }
            75%{
              transform: translateX(45%);

             blue, red, green, yellow, pink, gray, orange);
            }
             100%{ transform: translateX(50%);

                 color:#ffffff;
                 scale: 0.9;
                 rotate: -20deg;
                 }
               }
        .card1 {

              }
         @keyframes movle {

             overflow-anchor: none;

              }

             blue, rgb(89, 51, 213), rgb(128, 0, 19), rgb(215, 18, 100) );
                scale: 0.9;
                rotate: -20deg;
              }
            }
    </style>
</head>
